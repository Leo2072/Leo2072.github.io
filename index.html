<!DOCTYPE HTML>
<html>

<head>
    <title>CPSC 581 - L1 - G5</title>
    <link rel="icon" type="image/x-icon" href="Sprites/penguin_title_icon.png" id="title-icon" />
    <link rel="stylesheet" href="index.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Include all of the (Function and Class Definitions ONLY) script modules here. -->
    <script src="Scripts/base.js" defer></script>
    <script src="Scripts/title_icon_randomiser.js" defer></script>
    <script src="Scripts/hole.js" defer></script>
    <script src="Scripts/mole.js" defer></script>
    <script src="Scripts/dog.js" defer></script>
    <script src="Scripts/penguin.js" defer></script>

    <!-- Include all of the method-calling scripts here. -->
    <script src="Scripts/main.js" defer></script>
</head>

<body>
    <div class="game-bound">
        <div class="instruction-container">
            <div id="score-display">Score: 0</div>
            <div id="target-display">Click: ?</div>
            <div id="timer-display">Time: 30</div>
        </div>
        <div class="slot-container">
            <div class="game-slot">
                <img class="animal-button" src="Sprites/penguin_title_icon.png" />
            </div>
            <div class="game-slot">
                <img class="animal-button" src="Sprites/raccoon_title_icon.png" />
            </div>
            <div class="game-slot">
                <img class="animal-button" src="Sprites/dog_title_icon.png" />
            </div>
        </div>
    </div>
</body>

</html>
