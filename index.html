<!DOCTYPE HTML>
<html>

<head>
    <title>CPSC 581 - L1 - G5</title>
    <link rel="icon" type="image/x-icon" href="Sprites/penguin_title_icon.png" id="title-icon" />
    <link rel="stylesheet" href="index.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Include all of the (Function and Class Definitions ONLY) script modules here. -->
    <script src="Scripts/base.js" defer></script>
    <script src="Scripts/title_icon_randomiser.js" defer></script>
    <script src="Scripts/mole.js" defer></script>
    <script src="Scripts/dog.js" defer></script>
    <script src="Scripts/penguin.js" defer></script>
    <script src="Scripts/raccoon.js" defer></script>

    <!-- Include all of the method-calling scripts here. -->
    <script src="Scripts/main.js" defer></script>
</head>

<body>
    <div id="game-bound">
        <div id="instruction-container">
            <div id="score-display">Score: 0</div>
            <div id="target-display">
                <span id="target-label">Click:</span>
                <img id="target-icon" />
            </div>
            <div id="timer-display" style="--norm-fill:1.0;">
                <div id="timer-fill"></div>
            </div>
        </div>
        <div id="slot-container">
            <div class="game-slot">
                <img class="animal-button" src="Sprites/Penguin/penguin_idle.png" />
            </div>
            <div class="game-slot">
                <img class="animal-button" src="Sprites/Raccoon/raccoon_idle.png" />
            </div>
            <div class="game-slot">
                <img class="animal-button" src="Sprites/Dog/dog_idle.png"/>
            </div>
        </div>
    </div>
    <div id="reward-screen">
        <h1 id="reward-title">REWARD</h1>
        <img id="reward-image" src="Sprites/Rewards/DogSneeze.gif"/>
    </div>
</body>

</html>
